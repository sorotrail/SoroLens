{{- if and (eq .Values.config.sourceMode "rpc") (not .Values.database.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sorolens.fullname" . }}-db
  labels:
    {{- include "sorolens.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "database.url is required in standalone mode (sourceMode=rpc) when database.existingSecret is not set" .Values.database.url | quote }}
{{- end }}
