# Source: sorolens/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sorolens
  labels:
    helm.sh/chart: sorolens-0.1.0
    app.kubernetes.io/name: sorolens
    app.kubernetes.io/instance: sorolens
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sorolens
      app.kubernetes.io/instance: sorolens
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: sorolens
        app.kubernetes.io/instance: sorolens
    spec:
      serviceAccountName: sorolens-runner
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: sorolens
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          image: "ghcr.io/sorotrail/sorolens:0.1.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sorolens
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: existing-db-secret
                  key: DATABASE_URL
          # /livez checks only that the process is alive so a transient RPC or
          # database outage never triggers a container restart loop.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          # /readyz consults the active EventSource (Postgres + RPC in
          # standalone mode, SoroTrail in upstream mode) so unhealthy pods are
          # removed from Service endpoints without being restarted.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
---
