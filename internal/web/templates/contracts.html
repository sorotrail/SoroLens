{{define "content"}}
{{$d := .Data}}
<h1>Contracts</h1>
<p class="muted">Every contract this instance has events for, most recently active first.</p>

<form class="filters" action="/contracts" method="get">
  <div>
    <label for="search">Filter by contract ID</label>
    <input id="search" type="text" name="search" value="{{$d.Search}}"
           placeholder="CDLZ…" size="32" autocomplete="off" spellcheck="false">
  </div>
  <button type="submit">Search</button>
  {{if $d.Search}}<a href="/contracts">clear</a>{{end}}
</form>

<div id="contracts">
  {{template "contracts-table" $d}}
</div>
{{end}}
